name: NAMLoader
options:
  bundleIdPrefix: com.contoh        # GANTI dengan domain/ID milikmu
  deploymentTarget:
    iOS: "17.0"
targets:
  NAMLoader:
    type: application
    platform: iOS
    sources:
      - path: NAMLoader
      - path: NeuralAmpModelerCore/NAM
        excludes: ["**/*.md", "**/*.txt"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contoh.namloader   # GANTI, harus unik
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: NAMLoader/NAMLoader-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_OPTIMIZATION_LEVEL: "3"
        GCC_PREPROCESSOR_DEFINITIONS: ["NAM_SAMPLE_FLOAT=1", "$(inherited)"]
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/NeuralAmpModelerCore
          - $(SRCROOT)/NeuralAmpModelerCore/Dependencies
          - $(SRCROOT)/NeuralAmpModelerCore/Dependencies/eigen
          - $(SRCROOT)/NeuralAmpModelerCore/Dependencies/nlohmann
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: NAMLoader
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Untuk mendengar gitar atau mikrofon kamu. Audio tidak pernah meninggalkan perangkat."
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
