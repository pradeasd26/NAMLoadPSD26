name: NAMLoader
options:
  bundleIdPrefix: com.pradea26
  deploymentTarget:
    iOS: "17.0"
targets:
  NAMLoader:
    type: application
    platform: iOS
    sources:
      - path: NAMLoader
      - path: NeuralAmpModelerCore/NAM
        excludes: ["**/*.md", "**/*.txt"]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: NAMLoader
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Untuk mendengar gitar atau mikrofon kamu. Audio tidak pernah meninggalkan perangkat."
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pradea26.namloader
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: NAMLoader/NAMLoader-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        GCC_OPTIMIZATION_LEVEL: "3"
        GCC_PREPROCESSOR_DEFINITIONS: ["NAM_SAMPLE_FLOAT=1", "$(inherited)"]
        GENERATE_INFOPLIST_FILE: NO
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/NeuralAmpModelerCore
          - $(SRCROOT)/NeuralAmpModelerCore/Dependencies
          - $(SRCROOT)/NeuralAmpModelerCore/Dependencies/eigen
          - $(SRCROOT)/NeuralAmpModelerCore/Dependencies/nlohmann
